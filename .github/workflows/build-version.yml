name: Build Version Meta

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  update-x-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compute version
        shell: bash
        run: |
          echo "VERSION=$(date -u +'%Y.%m.%d')+${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Update sitemap and x-build meta
        run: |
          npm run generate:sitemap
          node scripts/update_build_meta.js

      - name: Commit and push if changed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html frontend/index.html sitemap.xml
            git commit -m "chore(meta): update x-build to ${VERSION} [skip ci] [build-metadata]"
            git push
          fi
