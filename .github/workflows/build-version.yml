name: Build Version Meta

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  update-x-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute version
        run: echo "VERSION=$(date -u +'%Y.%m.%d')+$(git rev-parse --short=7 HEAD)" >> $GITHUB_ENV

      - name: Update x-build meta in index.html
        shell: bash
        run: |
          file=index.html
          if grep -q 'name="x-build"' "$file"; then
            sed -i -E "s@(meta name=\\\"x-build\\\" content=\\\")[^"]*(\\\")@\\1${VERSION}\\2@" "$file"
          else
            echo "Missing x-build meta tag in $file" >&2
            exit 1
          fi

      - name: Commit and push if changed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "chore(meta): update x-build to ${VERSION} [skip ci] [build-metadata]"
            git push
          fi

