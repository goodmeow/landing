services:
  blog:
    image: ghost:5-alpine
    container_name: blog_ghost
    restart: unless-stopped
    environment:
      # Set the public URL to a subdirectory; override via deploy/.env.blog with GHOST_PUBLIC_URL
      url: ${GHOST_PUBLIC_URL:-https://www.goodmeow.my.id/blog}
      database__client: sqlite3
      database__connection__filename: /var/lib/ghost/content/data/ghost.db
    env_file:
      - ./.env.blog
    volumes:
      - ../blog_content:/var/lib/ghost/content
    networks:
      web:
        aliases:
          - blog
      default: {}
    expose:
      - "2368"

networks:
  web:
    external: true

