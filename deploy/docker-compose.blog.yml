services:
  blog_db:
    image: mysql:8.4
    container_name: blog_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ghost}
      MYSQL_USER: ${MYSQL_USER:-ghost}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ghostpass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root}
    command: ["--default-authentication-plugin=mysql_native_password"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - ../blog_mysql:/var/lib/mysql
    networks:
      - default

  blog:
    image: ghost:5-alpine
    container_name: blog_ghost
    restart: unless-stopped
    environment:
      # Serve under subdomain by default; override in .env.blog
      url: ${GHOST_PUBLIC_URL:-https://blog.goodmeow.my.id}
      database__client: mysql
      database__connection__host: blog_db
      database__connection__user: ${MYSQL_USER:-ghost}
      database__connection__password: ${MYSQL_PASSWORD:-ghostpass}
      database__connection__database: ${MYSQL_DATABASE:-ghost}
      mail__transport: ${mail__transport:-smtp}
      mail__from: ${mail__from:-"Goodmeow Blog <no-reply@goodmeow.my.id>"}
      mail__options__host: ${mail__options__host:-smtp.example.com}
      mail__options__port: ${mail__options__port:-587}
      mail__options__secure: ${mail__options__secure:-false}
      mail__options__auth__user: ${mail__options__auth__user:-USERNAME}
      mail__options__auth__pass: ${mail__options__auth__pass:-PASSWORD}
    env_file:
      - ./.env.blog
    volumes:
      - ../blog_content:/var/lib/ghost/content
    depends_on:
      blog_db:
        condition: service_healthy
    networks:
      web:
        aliases:
          - blog
      default: {}
    expose:
      - "2368"

networks:
  web:
    external: true
