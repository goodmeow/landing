version: "3.8"
services:
  landing:
    image: nginx:alpine
    container_name: landing_www
    restart: unless-stopped
    volumes:
      - ../index.html:/usr/share/nginx/html/index.html:ro
      - ../styles.css:/usr/share/nginx/html/styles.css:ro
      - ../robots.txt:/usr/share/nginx/html/robots.txt:ro
      - ../sitemap.xml:/usr/share/nginx/html/sitemap.xml:ro
      - ../favicon.svg:/usr/share/nginx/html/favicon.svg:ro
      - ../favicon-32x32.png:/usr/share/nginx/html/favicon-32x32.png:ro
      - ../apple-touch-icon.png:/usr/share/nginx/html/apple-touch-icon.png:ro
      - ../site.webmanifest:/usr/share/nginx/html/site.webmanifest:ro
      - ./nginx/site.conf:/etc/nginx/conf.d/default.conf:ro
      - ../404.html:/usr/share/nginx/html/404.html:ro
    networks:
      web:
        aliases:
          - landing
      default: {}
    expose:
      - "80"

networks:
  web:
    external: true
