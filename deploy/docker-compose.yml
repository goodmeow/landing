services:
  landing:
    image: nginx:1.31.2-alpine
    container_name: landing_www
    restart: unless-stopped
    volumes:
      - ../dist:/usr/share/nginx/html:ro
      - ./nginx/site.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      web:
        aliases:
          - landing
      default: {}
    expose:
      - "80"

networks:
  web:
    external: true
