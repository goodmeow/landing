# Redirect HTTP → HTTPS
server {
  listen 80;
#  listen [::]:80;
  server_name goodmeow.my.id www.goodmeow.my.id;
  return 301 https://$host$request_uri;
}

# HTTPS (Cloudflare Origin Cert), canonicalize to www
server {
  listen 443 ssl;  # http2 moved to directive
#  listen [::]:443 ssl;
  http2 on;
  server_name goodmeow.my.id www.goodmeow.my.id;

  ssl_certificate     /etc/nginx/certs/20250823_origin.pem;
  ssl_certificate_key /etc/nginx/certs/20250823_origin.key;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_protocols TLSv1.2 TLSv1.3;

  # Force canonical host
  if ($host = goodmeow.my.id) {
    return 301 https://www.goodmeow.my.id$request_uri;
  }

  # Security headers
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options nosniff;
  add_header X-Frame-Options SAMEORIGIN;
  add_header Referrer-Policy strict-origin-when-cross-origin;
  # Inline styles/scripts are needed by the app shell (theme bootstrap,
  # JSON-LD); the blog host is whitelisted for the Ghost Content API.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://secure.gravatar.com; connect-src 'self' https://blog.goodmeow.my.id; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;

  # Real client IP from Cloudflare
  real_ip_header CF-Connecting-IP;
  set_real_ip_from 173.245.48.0/20;
  set_real_ip_from 103.21.244.0/22;
  set_real_ip_from 103.22.200.0/22;
  set_real_ip_from 103.31.4.0/22;
  set_real_ip_from 141.101.64.0/18;
  set_real_ip_from 108.162.192.0/18;
  set_real_ip_from 190.93.240.0/20;
  set_real_ip_from 188.114.96.0/20;
  set_real_ip_from 197.234.240.0/22;
  set_real_ip_from 198.41.128.0/17;
  set_real_ip_from 162.158.0.0/15;
  set_real_ip_from 104.16.0.0/12;
  set_real_ip_from 172.64.0.0/13;
  set_real_ip_from 131.0.72.0/22;

  set $landing_upstream http://landing:80;

  location / {
    proxy_pass $landing_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Cache ringan asset statis
    if ($request_uri ~* "\.(js|css|png|jpg|jpeg|gif|svg|ico|webmanifest)$") {
      expires 7d;
      add_header Cache-Control "public, max-age=604800, immutable";
    }
  }
}
