server {
  listen 80;
#  listen [::]:80;
  server_name goodmeow.my.id www.goodmeow.my.id;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;  # http2 moved to directive
#  listen [::]:443 ssl;
  http2 on;
  server_name goodmeow.my.id www.goodmeow.my.id;

  # TLS certs (Cloudflare origin)
  ssl_certificate     /etc/nginx/certs/20250823_origin.pem;
  ssl_certificate_key /etc/nginx/certs/20250823_origin.key;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_protocols TLSv1.2 TLSv1.3;

  # Canonicalize to www
  if ($host = goodmeow.my.id) {
    return 301 https://www.goodmeow.my.id$request_uri;
  }

  # Security headers
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options nosniff;
  add_header X-Frame-Options SAMEORIGIN;
  add_header Referrer-Policy strict-origin-when-cross-origin;

  # Proxy to landing
  location / {
    proxy_pass http://landing:80;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Cache static assets
    if ($request_uri ~* "\.(js|css|png|jpg|jpeg|gif|svg|ico|webmanifest)$") {
      expires 7d;
      add_header Cache-Control "public, max-age=604800, immutable";
    }
  }
}
