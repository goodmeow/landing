server {
  listen 80;
  listen [::]:80;
  server_name goodmeow.my.id www.goodmeow.my.id;
  return 301 https://www.goodmeow.my.id$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name goodmeow.my.id www.goodmeow.my.id;

  # Reuse TLS params/certs from your existing Immich config
  # Adjust include path to where immich.conf is mounted in the proxy container
  include /etc/nginx/conf.d/immich.conf;

  # Optional: force a single canonical host
  if ($host = goodmeow.my.id) {
    return 301 https://www.goodmeow.my.id$request_uri;
  }

  location / {
    proxy_pass http://landing:80;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
  }
}

