## --- Global (http) context directives ---
## Rate limiting per IP
limit_req_zone $binary_remote_addr zone=req_per_ip:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=perip:10m;

## Simple UA-based blocking for AI crawlers/scrapers
map $http_user_agent $block_ai {
  default 0;
  ~*(gptbot|chatgpt|openai|google-extended|ccbot|commoncrawl|claudebot|anthropic-ai|perplexitybot|bytespider|dataforseo|facebookbot|twitterbot) 1;
}

server {
  listen 80;
#  listen [::]:80;
  server_name goodmeow.my.id www.goodmeow.my.id;
  return 301 https://$host$request_uri;
}

# Blog subdomain HTTP → HTTPS
server {
  listen 80;
#  listen [::]:80;
  server_name blog.goodmeow.my.id;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;  # http2 moved to directive
#  listen [::]:443 ssl;
  http2 on;
  server_name goodmeow.my.id www.goodmeow.my.id;

  # TLS certs (Cloudflare origin)
  ssl_certificate     /etc/nginx/certs/20250823_origin.pem;
  ssl_certificate_key /etc/nginx/certs/20250823_origin.key;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_protocols TLSv1.2 TLSv1.3;

  # Canonicalize to www
  if ($host = goodmeow.my.id) {
    return 301 https://www.goodmeow.my.id$request_uri;
  }

  # Security headers
  server_tokens off;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options nosniff;
  add_header X-Frame-Options SAMEORIGIN;
  add_header Referrer-Policy strict-origin-when-cross-origin;
  add_header X-Robots-Tag "noai, noimageai" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), fullscreen=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' https://www.gravatar.com data:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;

  # Proxy to landing
  location / {
    # Block AI crawlers by UA
    if ($block_ai) { return 403; }

    # Only allow safe methods for static site
    if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { return 405; }

    # Basic rate/connection limiting (per IP)
    limit_req zone=req_per_ip burst=30 nodelay;
    limit_req_status 429;
    limit_conn perip 20;

    client_max_body_size 1k;
    client_body_timeout 5s;
    send_timeout 15s;
    keepalive_timeout 20s;

    proxy_pass http://landing:80;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Cache static assets
    if ($request_uri ~* "\.(js|css|png|jpg|jpeg|gif|svg|ico|webmanifest)$") {
      expires 7d;
      add_header Cache-Control "public, max-age=604800, immutable";
    }
  }

  # Blog (Ghost) served under subpath /blog/
  location /blog/ {
    # Block AI crawlers by UA (reuse map)
    if ($block_ai) { return 403; }

    # Allow POST for Ghost APIs (signup/signin/etc.)
    if ($request_method !~ ^(GET|HEAD|POST|OPTIONS)$) { return 405; }

    # Forward to Ghost service on Docker network
    proxy_pass http://blog:2368/; # trailing slash important for subdir
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Caching for static assets
    if ($request_uri ~* "/blog/(assets/|content/images/|public/).+\.(js|css|png|jpg|jpeg|gif|svg|webp|ico)$") {
      expires 7d;
      add_header Cache-Control "public, max-age=604800, immutable";
    }
  }
}

# Blog subdomain with TLS
server {
  listen 443 ssl;
#  listen [::]:443 ssl;
  http2 on;
  server_name blog.goodmeow.my.id;

  # Reuse the same TLS certs if wildcard/SAN includes blog.goodmeow.my.id
  ssl_certificate     /etc/nginx/certs/20250823_origin.pem;
  ssl_certificate_key /etc/nginx/certs/20250823_origin.key;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_protocols TLSv1.2 TLSv1.3;

  # Security headers
  server_tokens off;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options nosniff;
  add_header X-Frame-Options SAMEORIGIN;
  add_header Referrer-Policy strict-origin-when-cross-origin;
  add_header X-Robots-Tag "noai, noimageai" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), fullscreen=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' https://www.gravatar.com data:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;

  # Blog root reverse proxy
  location / {
    if ($block_ai) { return 403; }
    # Allow POST for Ghost (members/admin)
    if ($request_method !~ ^(GET|HEAD|POST|OPTIONS)$) { return 405; }
    limit_req zone=req_per_ip burst=30 nodelay;
    limit_req_status 429;
    limit_conn perip 20;

    proxy_pass http://blog:2368/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    if ($request_uri ~* "\.(js|css|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$") {
      expires 7d;
      add_header Cache-Control "public, max-age=604800, immutable";
    }
  }
}
