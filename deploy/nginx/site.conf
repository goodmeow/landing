server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Unknown paths get the app shell (which renders the 404 page) with a real
  # 404 status, so search engines do not index them as live pages.
  error_page 404 /index.html;

  location / {
    try_files $uri $uri/ =404;
  }
}
