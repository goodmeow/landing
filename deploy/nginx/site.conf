server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Unknown paths get the app shell (which renders the 404 page) with a real
  # 404 status, so search engines do not index them as live pages.
  error_page 404 /index.html;

  # Client-side routes get the app shell; unknown paths keep a real 404.
  # shortcut: routes are listed by hand, add each new route here.
  location ~ ^/(privacy|stream)/?$ {
    try_files /index.html =404;
  }

  location /assets/ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
